name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  nim-version: '2.2.8'
jobs:
  tests:
    strategy:
      # run tests on all versions, even if one fails
      fail-fast: false
      matrix:
        # add any other Typst versions that your package should support
        typst-version:
          - typst: 0.13
            tytanic: 0.2
          - typst: 0.14
            tytanic: 0.3
            # the docs don't need to build with all versions supported by the package;
            # the latest one is enough
            doc: true

    name: Test for ${{ matrix.typst-version.typst }} (Tytanic ${{ matrix.typst-version.tytanic }}${{ matrix.typst-version.doc && ', with docs' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Setup typst
        id: setup-typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ matrix.typst-version.typst }}

      - name: Setup tytanic
        uses: typst-community/setup-tytanic@v1
        with:
          tytanic-version: ${{ matrix.typst-version.tytanic }}

      - name: Setup plugin compiler
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.nim-version }}
      
      - name: setup wasi sdk
        uses: konsumer/install-wasi-sdk@v1

      - name: Compile plugin
        run: env -C lib nimble run

      - name: Run test suite
        run: just test

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typst-${{ steps.setup-typst.outputs.typst-version }}-test-results
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5

      - name: Build docs
        if: ${{ matrix.typst-version.doc }}
        run: just doc
